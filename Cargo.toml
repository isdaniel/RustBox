[package]
name = "rustbox"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rustbox"
path = "src/main.rs"

[[bin]]
name = "daemon_rs"
path = "src/daemon/main.rs"

[profile.release]
debug = true

[dependencies]
nix = { version = "0.30.1", features = ["process", "mount", "sched", "fs", "net", "hostname", "user", "signal", "term"] }
libc = "0.2.177"
thiserror = "2.0.17"
clap = { version = "4.5.48", features = ["derive"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
tokio = { version = "1.48", features = ["net", "rt-multi-thread", "macros", "signal", "sync", "time", "io-util", "fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
chrono = { version = "0.4.42", features = ["serde"] }
rand = "0.9.2"
regex = "1.12.2"
termion = "4.0.5"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
